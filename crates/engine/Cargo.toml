[package]
name = "tachyon-engine"
description = "Segmented, resumable HTTP download engine with dynamic file segmentation"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
anyhow.workspace = true
thiserror.workspace = true
tokio.workspace = true
tokio-util.workspace = true
futures-util.workspace = true
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
parking_lot.workspace = true
chrono.workspace = true
dirs.workspace = true
url.workspace = true
percent-encoding.workspace = true
log.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_Security_Cryptography", "Win32_System_IO", "Win32_System_Ioctl", "Win32_NetworkManagement_IpHelper", "Win32_Networking_WinSock", "Win32_System_Threading"] }

[dev-dependencies]
env_logger.workspace = true
tempfile = "3"
