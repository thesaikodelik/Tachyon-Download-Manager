[package]
name = "tachyon"
description = "Tachyon Download Manager — a native download accelerator for macOS and Windows built with GPUI"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "tachyon"
path = "src/main.rs"

[dependencies]
tachyon-engine.workspace = true
gpui = "0.2.2"
anyhow.workspace = true
chrono.workspace = true
log.workspace = true
env_logger.workspace = true
url.workspace = true
unicode-segmentation = "1.12"
png = { version = "0.17", optional = true }
raw-window-handle = "0.6"

[target.'cfg(target_os = "macos")'.dependencies]
objc = { version = "0.2", optional = true }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Gdi",
    "Win32_Storage_Xps",
    "Win32_System_Power",
    "Win32_System_Registry",
    "Win32_UI_Controls",
    "Win32_UI_WindowsAndMessaging",
] }

[features]
# Saves window PNGs on demand for visual checks; see src/snapshot.rs.
dev-snapshots = ["dep:objc", "dep:png"]
