[package]
name = "tachyon"
description = "Tachyon Download Manager — a native download accelerator for macOS and Windows built with GPUI"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "tachyon"
path = "src/main.rs"

[dependencies]
tachyon-engine.workspace = true
gpui = "0.2.2"
anyhow.workspace = true
chrono.workspace = true
log.workspace = true
env_logger.workspace = true
url.workspace = true
unicode-segmentation = "1.12"
png = "0.17"
raw-window-handle = "0.6"

[target.'cfg(target_os = "macos")'.dependencies]
objc = { version = "0.2", optional = true }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Gdi",
    "Win32_Security",
    "Win32_Storage_Xps",
    "Win32_System_Power",
    "Win32_System_Registry",
    "Win32_System_Threading",
    "Win32_UI_Controls",
    "Win32_UI_WindowsAndMessaging",
] }
tray-icon = "0.26"

# The COM-based shell APIs (drag and drop) are far simpler through `windows`, which
# GPUI already depends on.
windows = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Storage_FileSystem",
    "Win32_System_Com",
    "Win32_System_DataExchange",
    "Win32_System_Memory",
    "Win32_System_Ole",
    "Win32_UI_Controls",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[build-dependencies]
winresource = "0.1"

[features]
# Saves window PNGs on demand for visual checks; see src/snapshot.rs.
dev-snapshots = ["dep:objc"]
