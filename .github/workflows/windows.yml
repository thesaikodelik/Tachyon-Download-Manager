name: Windows

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace
      - run: cargo build --release -p tachyon

      # tachyon.exe is its own installer; the extension ships as a zip.
      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item target/release/tachyon.exe dist/TachyonSetup.exe
          Compress-Archive -Path extension/* -DestinationPath dist/tachyon-extension.zip -Force
          $hash = (Get-FileHash dist/TachyonSetup.exe -Algorithm SHA256).Hash.ToLower()
          "$hash  TachyonSetup.exe" | Out-File -Encoding ascii -NoNewline dist/TachyonSetup.exe.sha256

      # Code signing (SignPath Foundation) goes here once the project is accepted.

      - uses: actions/upload-artifact@v4
        with:
          name: tachyon-windows-x64
          path: dist/

      # A version tag publishes its files on the release (made here if it doesn't exist).
      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "${{ github.ref_name }}"
          gh release view $tag 2>$null
          if ($LASTEXITCODE -ne 0) {
            gh release create $tag --title "Tachyon $($tag.TrimStart('v')) for Windows" --generate-notes
          }
          gh release upload $tag dist/TachyonSetup.exe dist/TachyonSetup.exe.sha256 dist/tachyon-extension.zip --clobber
